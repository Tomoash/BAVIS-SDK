# Checks, tests and builds every example and contributed driver with the BAVIS Docker image.
# Runs only when the repository variable BAVIS_SDK_IMAGE is set (e.g. ghcr.io/tomoash/bavis:4); the image becomes public with
# BAVIS 4.0. For a private image add the secret BAVIS_REGISTRY_TOKEN (a token with read:packages).
name: examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    if: vars.BAVIS_SDK_IMAGE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          image: ${{ vars.BAVIS_SDK_IMAGE }}
          workspace: examples/* drivers/*
          build: "true"
          registry-token: ${{ secrets.BAVIS_REGISTRY_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: bavispkg
          path: |
            examples/*/dist/*.bavispkg
            drivers/*/dist/*.bavispkg
          if-no-files-found: ignore
